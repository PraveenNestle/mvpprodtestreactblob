name: Build and deploy Stability Capture to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  AZURE_WEBAPP_NAME: nsus-dv-sfdfdev-adi-281-app
  AZURE_WEBAPP_URL: https://nsus-dv-sfdfdev-adi-281-app.azurewebsites.net
  API_AUDIENCE: api://stability-capture-api-dev

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install API dependencies
        working-directory: sdct/backend/api
        run: npm ci --no-audit --no-fund

      - name: Run API smoke tests
        working-directory: sdct/backend/api
        run: npm test

      - name: Install frontend dependencies
        working-directory: sdct/frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: sdct/frontend
        env:
          FRONTEND_API_BASE: ${{ env.AZURE_WEBAPP_URL }}
          FRONTEND_API_SCOPE: ${{ env.API_AUDIENCE }}/access_as_user
          FRONTEND_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID || vars.VITE_ENTRA_CLIENT_ID }}
          FRONTEND_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID || vars.VITE_ENTRA_TENANT_ID }}
        run: |
          rm -rf dist
          export VITE_BUILD_STAMP="${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)"
          if [ -n "$FRONTEND_ENTRA_CLIENT_ID" ] && [ -n "$FRONTEND_ENTRA_TENANT_ID" ]; then
            echo "Building frontend in Azure API + Microsoft Entra mode."
            export VITE_API_BASE="$FRONTEND_API_BASE"
            export VITE_AUTH_MODE=msal
            export VITE_ENTRA_CLIENT_ID="$FRONTEND_ENTRA_CLIENT_ID"
            export VITE_ENTRA_TENANT_ID="$FRONTEND_ENTRA_TENANT_ID"
            export VITE_API_SCOPE="$FRONTEND_API_SCOPE"
          else
            echo "::warning::VITE_ENTRA_CLIENT_ID or VITE_ENTRA_TENANT_ID is missing. Building frontend in demo mode. Add them under Settings > Secrets and variables > Actions to use Azure API and Blob Storage."
            export VITE_API_BASE=
            export VITE_AUTH_MODE=demo
          fi
          npm run build
          if grep -R "Loading Stability Capture\|Preparing demo data" dist; then
            echo "Old loading screen text found in built frontend. Refusing to deploy stale bundle."
            exit 1
          fi

      - name: Create Azure Web App package
        shell: bash
        run: |
          rm -rf deploy_package deploy.zip
          mkdir -p deploy_package/frontend deploy_package/backend
          cp -R sdct/frontend/dist deploy_package/frontend/dist
          cp -R sdct/frontend/dist/. deploy_package/
          cp -R sdct/backend/api deploy_package/backend/api
          rm -rf deploy_package/backend/api/node_modules
          cat > deploy_package/package.json <<'JSON'
          {
            "name": "stability-capture-webapp",
            "private": true,
            "engines": {
              "node": ">=22"
            },
            "scripts": {
              "start": "npm start --prefix backend/api",
              "postinstall": "npm ci --omit=dev --omit=optional --no-audit --no-fund --prefix backend/api"
            }
          }
          JSON
          cd deploy_package
          zip -qr ../deploy.zip .

      - name: Verify deployment package content
        shell: bash
        run: |
          unzip -q deploy.zip -d verify_package
          if grep -R "Loading Stability Capture\|Preparing demo data" verify_package; then
            echo "Old loading screen text found in deploy.zip. Refusing to deploy stale package."
            exit 1
          fi
          test -f verify_package/index.html || { echo "Missing root index.html in deploy.zip"; exit 1; }
          test -f verify_package/frontend/dist/index.html || { echo "Missing frontend/dist/index.html in deploy.zip"; exit 1; }
          echo "Deployment package verified."

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5145D9368E3940D2A3B53A42009CCF9F }}
          package: deploy.zip

      - name: Verify live site is not stale
        shell: bash
        run: |
          body="$(curl -fsSL "${{ env.AZURE_WEBAPP_URL }}?build=${GITHUB_SHA}" || true)"
          if echo "$body" | grep -E "Loading Stability Capture|Preparing demo data"; then
            echo "Live Web App is still serving the old loading screen after deployment. Restart the App Service or clear the deployment cache, then rerun this workflow."
            exit 1
          fi
          echo "Live site check completed."